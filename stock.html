<!-- FAB (Suppressed based on context: Settings/Details logic) -->
<script>
    const DEFAULT_GUILD_ID = "1479040070894882908";

    function getGuildIdFromUrl() {
        try {
            const params = new URLSearchParams(window.location.search);
            return params.get("guildId") || DEFAULT_GUILD_ID;
        } catch (e) {
            return DEFAULT_GUILD_ID;
        }
    }

    function updateUi(stats) {
        const online = Number(stats.online || 0);
        const offline = Number(stats.offline || 0);
        const total = Number(stats.total || (online + offline));
        document.getElementById("onlineCount").textContent = online;
        document.getElementById("offlineCount").textContent = offline;
        document.getElementById("totalCount").textContent = total;
    }

    function markSynced() {
        const now = new Date();
        const time = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        document.getElementById("lastSync").textContent = time;
    }

    async function refreshStock() {
        const btn = document.getElementById("refreshBtn");
        const icon = document.getElementById("refreshIcon");
        btn.disabled = true;
        btn.classList.add("opacity-70");
        icon.classList.add("animate-spin");

        try {
            const guildId = getGuildIdFromUrl();
            const res = await fetch(`/stock/data?guildId=${encodeURIComponent(guildId)}`, { cache: "no-store" });
            if (!res.ok) {
                throw new Error("Bad response");
            }
            const data = await res.json(); // { online, offline, total }
            updateUi(data);
            markSynced();
        } catch (e) {
            console.error("Failed to refresh stock:", e);
        } finally {
            btn.disabled = false;
            btn.classList.remove("opacity-70");
            icon.classList.remove("animate-spin");
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("refreshBtn").addEventListener("click", refreshStock);
        refreshStock();
    });
</script>
